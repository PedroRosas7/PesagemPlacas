<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cálculo da média das placas</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f1f5f9;
      color: #172033;
    }

    main {
      max-width: 680px;
      margin: auto;
      padding: 28px;
      background: #1f1d1d;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(23, 32, 51, 0.18);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #f8fafc;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .linha {
      display: grid;
      grid-template-columns: 70px 1fr 1fr;
      gap: 12px;
      align-items: center;
      margin: 12px 0;
    }

    .cabecalho {
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 600;
    }

    label {
      font-weight: 600;
      color: #f8fafc;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      border: 1px solid #bdc8d8;
      border-radius: 7px;
      font: inherit;
      background: #fff;
      color: #172033;
    }

    input:focus {
      outline: 2px solid #2563eb;
      border-color: transparent;
    }

    .botoes {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 7px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"] {
      background: #2563eb;
      color: white;
    }

    button[type="reset"] {
      background: #e2e8f0;
      color: #172033;
    }

    #resultado {
      margin-top: 24px;
      white-space: pre-line;
      line-height: 1.7;
      color: #e2e8f0;
    }

    #resultado.erro {
      color: #fca5a5;
    }

    @media (max-width: 480px) {
      main { padding: 20px 16px; }
      .linha {
        grid-template-columns: 42px 1fr 1fr;
        gap: 7px;
      }
      input {
        padding: 9px 6px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Cálculo da média das placas</h1>
    <p>Informe os pesos em gramas para calcular a média de material de solda em kg.</p>

    <form id="formulario">
      <div class="linha cabecalho" aria-hidden="true">
        <span>Placa</span>
        <span>Peso (g)</span>
        <span>Peso + solda (g)</span>
      </div>

      <div id="campos"></div>

      <div class="botoes">
        <button type="submit">Calcular média</button>
        <button type="reset">Limpar</button>
      </div>
    </form>

    <div id="resultado" role="status" aria-live="polite"></div>
  </main>

  <script>
    const campos = document.querySelector("#campos");

    for (let i = 1; i <= 5; i += 1) {
      const linha = document.createElement("div");
      linha.className = "linha";

      linha.innerHTML =
        `<label for="peso-${i}">Placa ${i}</label>` +
        `<input id="peso-${i}" name="peso" type="text" inputmode="decimal" placeholder="Ex.: 1200" aria-label="Peso da placa ${i} em gramas" required>` +
        `<input id="solda-${i}" name="peso_solda" type="text" inputmode="decimal" placeholder="Ex.: 1250" aria-label="Peso da placa ${i} com solda em gramas" required>`;

      campos.appendChild(linha);
    }

    const formulario = document.querySelector("#formulario");
    const resultado = document.querySelector("#resultado");

    function ler_peso(valor) {
      const texto = String(valor).trim();
      if (!texto) return NaN;

      let normalizado = texto;
      if (normalizado.includes(",")) {
        normalizado = normalizado.replace(".", "").replace(",", ".");
      }

      const numero = Number(normalizado);
      return Number.isFinite(numero) ? numero : NaN;
    }

    function calcular() {
      const placas = Array.from({ length: 5 }, (_, i) => {
        const peso = ler_peso(document.querySelector(`#peso-${i + 1}`).value);
        const peso_solda = ler_peso(document.querySelector(`#solda-${i + 1}`).value);
        return { peso, peso_solda };
      });

      const resultados = [];
      const diferencas = [];

      placas.forEach((placa, index) => {
        const indice = index + 1;

        if (!Number.isFinite(placa.peso) || !Number.isFinite(placa.peso_solda)) {
          throw new Error(`Informe números válidos para a placa ${indice}.`);
        }

        const diferenca = placa.peso_solda - placa.peso;
        diferencas.push(diferenca);

        resultados.push(
          `Placa ${indice}: Peso ${placa.peso.toFixed(0)} g | Peso + solda ${placa.peso_solda.toFixed(0)} g | Solda: ${(diferenca / 1000).toFixed(2)} kg`
        );
      });

      const media = (diferencas.reduce((soma, valor) => soma + valor, 0) / diferencas.length) / 1000;

      return {
        placas: resultados,
        media
      };
    }

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();

      resultado.className = "";
      resultado.textContent = "Calculando...";

      try {
        const dados = calcular();
        resultado.textContent =
          dados.placas.join("\n") +
          `\n\nMédia das placas: ${dados.media.toFixed(2)} kg`;
      } catch (erro) {
        resultado.className = "erro";
        resultado.textContent = erro.message;
      }
    });

    formulario.addEventListener("reset", () => {
      resultado.className = "";
      resultado.textContent = "";
    });
  </script>
</body>
</html>
